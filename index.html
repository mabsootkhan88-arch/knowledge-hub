<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --primary: #2563eb; --text: #1e293b; --bg: #f8fafc; }
        body { 
            font-family: 'Inter', sans-serif; margin: 0; padding: 12px;
            width: 320px; height: 520px; display: flex; flex-direction: column;
            background: white; color: var(--text); box-sizing: border-box;
        }
        .header { 
            font-weight: 700; font-size: 13px; border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px; color: var(--primary); display: flex; justify-content: space-between;
        }
        /* Alignment Fix */
        .content-area { 
            flex-grow: 1; display: flex; flex-direction: column; 
            overflow-y: auto; margin: 10px 0; gap: 10px;
        }
        .instruction-box { 
            font-size: 14px; line-height: 1.6; padding: 10px;
            background: var(--bg); border-radius: 8px; border-left: 4px solid var(--primary);
        }
        .option-container { display: flex; flex-direction: column; gap: 8px; }
        .opt-btn { 
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; 
            border-radius: 8px; background: white; text-align: left;
            font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .opt-btn:hover { border-color: var(--primary); background: #eff6ff; }
        
        /* Admin Panel Styling */
        .admin-box { 
            display: none; padding: 10px; background: #f1f5f9; 
            border-radius: 8px; border: 1px solid #cbd5e1; margin-top: 10px;
        }
        .admin-box input { width: 100%; padding: 6px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .action-row { display: flex; gap: 5px; }
        .action-row button { flex: 1; padding: 8px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <span>KNOWLEDGE HUB PRO</span>
    <span id="admin-gear" style="cursor:pointer; display:none;">⚙️</span>
</div>

<div class="content-area" id="main-view">
    <div id="step-info" style="font-size: 10px; color: #64748b;">STEP 1</div>
    <div class="instruction-box" id="instr-text">Loading...</div>
    <div class="option-container" id="opt-container"></div>
    
    <div id="manual-nav" style="display:none; margin-top: auto;">
        <label style="font-size: 11px; display: block; margin-bottom: 8px;">
            <input type="checkbox" id="ack-check"> I have understood.
        </label>
        <button id="next-btn" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold;" disabled onclick="goNext()">Continue</button>
    </div>
</div>

<div id="admin-panel" class="admin-box">
    <input id="in-id" type="number" placeholder="Step ID">
    <input id="in-instr" type="text" placeholder="Instruction Text">
    <input id="in-opts" type="text" placeholder="Options (Yes:2, No:3)">
    <div class="action-row">
        <button onclick="saveStep()" style="background:#059669;">Save/Add</button>
        <button onclick="delStep()" style="background:#dc2626;">Delete ID</button>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbwtnD7T2_wBzOTVKgwVgf7SEQWVHREbH52ex7ZMoo3xe7g2VMYmx4Ev2oAM5IVnAqSx/exec";
    let steps = [];
    let current = 1;

    window.onload = async () => {
        const res = await fetch(API);
        const data = await res.json();
        const user = data.users.find(u => u.email === localStorage.getItem("user_email"));
        
        if(user?.role === "Admin") document.getElementById('admin-gear').style.display = "block";
        steps = data.steps;
        render(1);
    };

    function render(sid) {
        const s = steps.find(x => x.step == sid);
        if(!s) return finish();
        current = sid;
        document.getElementById('step-info').innerText = "STEP " + sid;
        document.getElementById('instr-text').innerText = s.instruction;
        const cont = document.getElementById('opt-container');
        const nav = document.getElementById('manual-nav');
        cont.innerHTML = "";

        if(s.options && s.options.trim() !== "") {
            nav.style.display = "none";
            s.options.split(',').forEach(o => {
                const [txt, next] = o.split(':');
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerText = "👉 " + txt.trim();
                btn.onclick = () => render(next.trim());
                cont.appendChild(btn);
            });
        } else {
            nav.style.display = "block";
            document.getElementById('ack-check').checked = false;
            document.getElementById('next-btn').disabled = true;
        }
    }

    document.getElementById('admin-gear').onclick = () => {
        const p = document.getElementById('admin-panel');
        p.style.display = p.style.display === "block" ? "none" : "block";
    };

    async function saveStep() {
        const body = { 
            action: "ADD_STEP", 
            stepId: document.getElementById('in-id').value,
            instr: document.getElementById('in-instr').value,
            opts: document.getElementById('in-opts').value
        };
        await fetch(API, { method: "POST", mode: 'no-cors', body: JSON.stringify(body) });
        alert("Synced with Sheet!"); location.reload();
    }

    async function delStep() {
        const body = { action: "DELETE_STEP", stepId: document.getElementById('in-id').value };
        await fetch(API, { method: "POST", mode: 'no-cors', body: JSON.stringify(body) });
        alert("Deleted from Sheet!"); location.reload();
    }

    document.getElementById('ack-check').onchange = function() { document.getElementById('next-btn').disabled = !this.checked; };
    function goNext() { render(parseInt(current) + 1); }
    function finish() { document.getElementById('main-view').innerHTML = "<h3>✅ Flow Complete</h3><button onclick='location.reload()'>Restart</button>"; }
</script>
</body>
</html>
