<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .header { font-weight: 700; font-size: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px; color: var(--primary); display: flex; justify-content: space-between; }
        .instruction { font-size: 13px; line-height: 1.5; margin: 10px 0; flex-grow: 1; overflow-y: auto; }
        .opt-grid { display: grid; gap: 8px; margin-top: auto; }
        .opt-btn { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer; text-align: left; font-size: 12px; font-weight: 500; }
        .opt-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
        .next-btn { width: 100%; margin-top: 10px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .next-btn:disabled { background: #cbd5e1; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 15px; }
    </style>
</head>
<body>

<div id="overlay">
    <div style="font-size: 40px; margin-bottom: 10px;">🔄</div>
    <div style="font-weight: 700; color: var(--primary);">Verifying Advisor...</div>
</div>

<div class="header">
    <span>KNOWLEDGE HUB PRO</span>
    <span id="step-id" style="color: var(--text-sub); font-size: 10px;">v1.0</span>
</div>

<div id="main-content" style="display: flex; flex-direction: column; height: 100%;">
    <div class="instruction" id="instr-text">Loading...</div>
    <div id="opt-container" class="opt-grid"></div>
    <div id="nav-area" style="display:none; margin-top: 10px;">
        <label style="font-size: 11px; cursor: pointer; display: block; margin-bottom: 5px;"><input type="checkbox" id="ack-check"> I have understood this step.</label>
        <button class="next-btn" id="next-btn" disabled onclick="goNext()">Continue</button>
    </div>
</div>

<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz1UhpKxbr3oDvp4LCFCV90RNO6aTZi77yowjmrqGZzEMr_8qb7pKHi2tuybWsMe-QY/exec";
    const DOMAIN = "@v5global.co.in";
    let masterData = [];
    let currentStep = 1;

    window.onload = async () => {
        let email = localStorage.getItem("user_email");
        if (!email) {
            email = prompt("Enter official email:");
            if (email && email.toLowerCase().endsWith(DOMAIN)) {
                localStorage.setItem("user_email", email.toLowerCase().trim());
                location.reload();
            } else {
                document.body.innerHTML = "<h3 style='text-align:center;color:red;padding-top:50px;'>UNAUTHORIZED ACCESS</h3>";
                return;
            }
        }
        await loadData();
    };

    async function loadData() {
        try {
            const res = await fetch(SHEET_API_URL, { redirect: 'follow' });
            const rawData = await res.json();
            const userEmail = localStorage.getItem("user_email");

            const userEntry = rawData.users.find(u => u.email === userEmail);
            if (!userEntry || userEntry.status.toLowerCase() !== "active") {
                document.body.innerHTML = "<h3 style='text-align:center;color:red;padding-top:50px;'>ACCESS REVOKED</h3>";
                return;
            }

            masterData = rawData.steps;
            document.getElementById('overlay').style.display = 'none';
            renderStep(1);
        } catch (e) {
            document.getElementById('overlay').innerHTML = "Connection Error. Restarting...";
            setTimeout(() => location.reload(), 3000);
        }
    }

    function renderStep(sid) {
        const data = masterData.find(d => d.step == sid);
        if (!data) return finish();
        currentStep = sid;
        document.getElementById('instr-text').innerText = data.instruction;
        document.getElementById('step-id').innerText = "STEP " + sid;
        const optCont = document.getElementById('opt-container');
        const navArea = document.getElementById('nav-area');
        optCont.innerHTML = "";
        if (data.options && data.options.trim() !== "") {
            navArea.style.display = "none";
            data.options.split(',').forEach(opt => {
                const parts = opt.split(':');
                if(parts.length === 2) {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn";
                    btn.innerText = parts[0].trim();
                    btn.onclick = () => renderStep(parts[1].trim());
                    optCont.appendChild(btn);
                }
            });
        } else {
            navArea.style.display = "block";
            document.getElementById('ack-check').checked = false;
            document.getElementById('next-btn').disabled = true;
        }
    }

    document.getElementById('ack-check').onchange = function() { document.getElementById('next-btn').disabled = !this.checked; };
    function goNext() { renderStep(parseInt(currentStep) + 1); }
    function finish() { document.getElementById('main-content').innerHTML = "<div style='text-align:center; padding:20px;'><h3>✅ Task Finished</h3><button onclick='location.reload()' style='padding:10px;cursor:pointer;'>Restart</button></div>"; }
</script>
</body>
</html>
