<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: var(--bg); 
            color: var(--text-main); 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Header Style */
        .header { 
            font-weight: 700; 
            font-size: 14px; 
            border-bottom: 1px solid #e2e8f0; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            color: var(--primary); 
            display: flex; 
            justify-content: space-between; 
            letter-spacing: 0.5px;
        }

        /* Main Content Display */
        .instruction { 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 15px 0; 
            min-height: 60px; 
            color: var(--text-main);
        }

        /* Options Buttons */
        .opt-grid { display: grid; gap: 10px; }
        .opt-btn { 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            background: #f8fafc; 
            cursor: pointer; 
            text-align: left; 
            font-size: 13px; 
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .opt-btn:hover { 
            background: #eff6ff; 
            border-color: var(--primary); 
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Navigation Area */
        .next-btn { 
            width: 100%; 
            margin-top: 15px; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
        }
        .next-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Centered Status Overlay (Access Revoked / Loading) */
        #overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: white; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 30px; 
            box-sizing: border-box; 
        }

        .status-icon { font-size: 48px; margin-bottom: 20px; }
        .status-title { font-size: 20px; font-weight: 700; color: var(--danger); margin-bottom: 10px; text-transform: uppercase; }
        .status-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; }

    </style>
</head>
<body>

<div id="overlay">
    <div id="status-content">
        <div class="status-icon">🔄</div>
        <div class="status-title" style="color: var(--primary);">Authenticating</div>
        <div class="status-desc">Verifying advisor credentials...</div>
    </div>
</div>

<div class="header">
    <span>KNOWLEDGE HUB PRO</span>
    <span id="step-id" style="color: var(--text-sub); font-size: 11px;">v1.0</span>
</div>

<div id="main-content">
    <div class="instruction" id="instr-text">Loading guidelines...</div>
    <div class="opt-grid" id="opt-container"></div>
    
    <div id="nav-area" style="display:none; margin-top: 15px;">
        <label style="font-size: 12px; color: var(--text-sub); cursor: pointer; display: flex; align-items: center;">
            <input type="checkbox" id="ack-check" style="margin-right: 8px;"> I have read and understood this step.
        </label>
        <button class="next-btn" id="next-btn" disabled onclick="goNext()">Continue</button>
    </div>
</div>

<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxZzcjIJEE-I__P4ThslVpyLaQi62SynNbepZMfEMJLYutRLtkaI3ftazx7u24vvHAQ/exec";
    const DOMAIN = "@v5global.co.in";
    const CURRENT_VERSION = "1.0"; 

    let masterData = [];
    let currentStep = 1;

    window.onload = async () => {
        let email = localStorage.getItem("user_email");
        if (!email) {
            email = prompt("Enter your @v5global.co.in email:");
            if (email && email.toLowerCase().endsWith(DOMAIN)) {
                localStorage.setItem("user_email", email.toLowerCase().trim());
            } else {
                showBlocked("UNAUTHORIZED", "Please use your official company email to log in.");
                return;
            }
        }
        loadData();
    };

    async function loadData() {
        try {
            const res = await fetch(SHEET_API_URL, { redirect: 'follow' });
            const rawData = await res.json();
            const userEmail = localStorage.getItem("user_email").toLowerCase().trim();

            // WHITELIST & KILL SWITCH LOGIC
            const userEntry = rawData.users.find(u => u.email === userEmail);
            
            if (!userEntry || userEntry.status.toLowerCase().trim() !== "active") {
                showBlocked("ACCESS REVOKED", "Your account is currently inactive.<br>Please reach out to your POC.");
                return;
            }

            // VERSION CHECK
            if (parseFloat(rawData.latestVersion) > parseFloat(CURRENT_VERSION)) {
                showBlocked("UPDATE REQUIRED", `A newer version (v${rawData.latestVersion}) is available.<br><button onclick='location.reload()' style='margin-top:15px; padding:10px 20px; cursor:pointer;'>Update Now</button>`, "⚠️");
                return;
            }

            masterData = rawData.steps;
            document.getElementById('overlay').style.display = 'none';
            renderStep(1);
        } catch (e) {
            showBlocked("DATABASE ERROR", "Unable to connect to the knowledge base.<br>Check your connection.", "❌");
        }
    }

    function showBlocked(title, desc, icon = "🚫") {
        document.getElementById('status-content').innerHTML = `
            <div class="status-icon">${icon}</div>
            <div class="status-title">${title}</div>
            <div class="status-desc">${desc}</div>
        `;
    }

    function renderStep(sid) {
        const data = masterData.find(d => d.step == sid);
        if (!data) return finish();
        
        currentStep = sid;
        document.getElementById('instr-text').innerText = data.instruction;
        document.getElementById('step-id').innerText = "STEP " + sid;
        
        const optCont = document.getElementById('opt-container');
        const navArea = document.getElementById('nav-area');
        optCont.innerHTML = "";
        
        if (data.options && data.options.trim() !== "") {
            navArea.style.display = "none";
            data.options.split(',').forEach(opt => {
                const parts = opt.split(':');
                if(parts.length === 2) {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn";
                    btn.innerText = parts[0].trim();
                    btn.onclick = () => renderStep(parts[1].trim());
                    optCont.appendChild(btn);
                }
            });
        } else {
            navArea.style.display = "block";
            document.getElementById('ack-check').checked = false;
            document.getElementById('next-btn').disabled = true;
        }
    }

    document.getElementById('ack-check').onchange = function() {
        document.getElementById('next-btn').disabled = !this.checked;
    };

    function goNext() { renderStep(parseInt(currentStep) + 1); }
    
    function finish() { 
        document.getElementById('main-content').innerHTML = `
            <div style='text-align:center; padding:30px 10px;'>
                <div style="font-size:40px; margin-bottom:15px;">✅</div>
                <h3 style="margin-bottom:10px;">Process Complete</h3>
                <p style="color:var(--text-sub); font-size:13px; margin-bottom:20px;">You have successfully followed all steps.</p>
                <button onclick='location.reload()' style='padding:10px 25px; border-radius:6px; border:1px solid #cbd5e1; background:white; cursor:pointer;'>Restart Flow</button>
            </div>`; 
    }
</script>
</body>
</html>
