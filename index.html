<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub Mini</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: #fff; color: #1e293b; overflow-x: hidden; }
        .header { font-weight: bold; font-size: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px; color: #2563eb; display: flex; justify-content: space-between; }
        .step-badge { font-size: 10px; background: #dbeafe; color: #2563eb; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .instruction { font-size: 13px; line-height: 1.5; margin: 10px 0; min-height: 50px; }
        .opt-grid { display: grid; gap: 8px; }
        .opt-btn { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; cursor: pointer; text-align: left; font-size: 12px; transition: 0.2s; }
        .opt-btn:hover { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .ack-section { margin-top: 10px; padding: 8px; background: #fff7ed; border-radius: 6px; font-size: 11px; }
        .next-btn { width: 100%; margin-top: 10px; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .next-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

<div id="overlay">
    <div id="status-text">Checking Access...</div>
</div>

<div class="header">
    <span>KNOWLEDGE HUB</span>
    <span class="step-badge" id="step-id">v1.0</span>
</div>

<div id="main-content">
    <div class="instruction" id="instr-text">Loading...</div>
    <div class="opt-grid" id="opt-container"></div>
    
    <div id="nav-area" style="display:none;">
        <div class="ack-section">
            <label><input type="checkbox" id="ack-check"> Acknowledge and Proceed</label>
        </div>
        <button class="next-btn" id="next-btn" disabled onclick="goNext()">Next Step</button>
    </div>
</div>

<script>
    // Aapka exact URL
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxzYTLcHjVoCsPRk0sr2L94_O-vqt7Su_zrODwBLh70djri9RY4Fb1EqSAtJ_BboJtE/exec";
    const DOMAIN = "@v5global.co.in";
    let masterData = [];
    let currentStep = 1;

    window.onload = async () => {
        let email = localStorage.getItem("user_email");
        if (!email || !email.endsWith(DOMAIN)) {
            email = prompt("Enter your @v5global.co.in email:");
            if (email && email.endsWith(DOMAIN)) {
                localStorage.setItem("user_email", email);
            } else {
                document.getElementById('status-text').innerHTML = "<h3 style='color:red;'>Access Denied!</h3>Official Email Required.";
                return;
            }
        }
        await loadData();
    };

    async function loadData() {
        try {
            // Google Script ke liye redirect handle karna zaroori hai
            const res = await fetch(SHEET_API_URL, { redirect: 'follow' });
            const rawData = await res.json();
            
            // Aapka data rawData.steps mein aa raha hai
            masterData = rawData.steps || []; 
            
            if (masterData.length === 0) {
                document.getElementById('status-text').innerText = "No data found in Sheet!";
                return;
            }

            document.getElementById('overlay').style.display = 'none';
            renderStep(1);
        } catch (e) {
            console.error(e);
            document.getElementById('status-text').innerHTML = "<b style='color:red;'>Database Error!</b><br>Please check AppScript Deployment.";
        }
    }

    function renderStep(sid) {
        const data = masterData.find(d => d.step == sid);
        if (!data) return finish();

        currentStep = sid;
        document.getElementById('instr-text').innerText = data.instruction;
        document.getElementById('step-id').innerText = "Step " + sid;
        
        const optCont = document.getElementById('opt-container');
        const navArea = document.getElementById('nav-area');
        optCont.innerHTML = "";
        document.getElementById('ack-check').checked = false;
        document.getElementById('next-btn').disabled = true;

        if (data.options && data.options.trim() !== "") {
            navArea.style.display = "none";
            data.options.split(',').forEach(opt => {
                const parts = opt.split(':');
                if (parts.length === 2) {
                    const label = parts[0].trim();
                    const next = parts[1].trim();
                    const btn = document.createElement('button');
                    btn.className = "opt-btn";
                    btn.innerText = label;
                    btn.onclick = () => renderStep(next);
                    optCont.appendChild(btn);
                }
            });
        } else {
            navArea.style.display = "block";
        }
    }

    document.getElementById('ack-check').onchange = function() {
        document.getElementById('next-btn').disabled = !this.checked;
    };

    function goNext() {
        // Find next step numerically if no options
        renderStep(parseInt(currentStep) + 1);
    }

    function finish() {
        document.getElementById('main-content').innerHTML = `
            <div style='text-align:center; padding:20px;'>
                <div style="font-size:30px;">✅</div>
                <b>Process Finished!</b><br><br>
                <button onclick='location.reload()' style='padding:8px 20px; border-radius:5px; border:1px solid #ccc; cursor:pointer;'>Restart</button>
            </div>`;
    }
</script>
</body>
</html>
