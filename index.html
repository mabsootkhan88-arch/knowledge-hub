<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub Mini</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #fff; }
        .header { font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; color: #2563eb; display: flex; justify-content: space-between; }
        .instruction { font-size: 14px; margin: 10px 0; min-height: 40px; }
        .opt-grid { display: grid; gap: 5px; }
        .opt-btn { padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; cursor: pointer; text-align: left; }
        .next-btn { width: 100%; margin-top: 10px; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .next-btn:disabled { background: #ccc; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="overlay">
    <div id="status-text">Authenticating Advisor...</div>
</div>

<div class="header">
    <span>KNOWLEDGE HUB</span>
    <span id="step-id">v1.0</span>
</div>

<div id="main-content">
    <div class="instruction" id="instr-text">Loading instructions...</div>
    <div class="opt-grid" id="opt-container"></div>
    <div id="nav-area" style="display:none; margin-top:10px;">
        <label style="font-size: 12px; cursor: pointer;"><input type="checkbox" id="ack-check"> I Acknowledge this step</label>
        <button class="next-btn" id="next-btn" disabled onclick="goNext()">Next Step</button>
    </div>
</div>

<script>
    // 1. APNA NEW URL YAHAN DALEIN
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxZzcjIJEE-I__P4ThslVpyLaQi62SynNbepZMfEMJLYutRLtkaI3ftazx7u24vvHAQ/exec";
    const DOMAIN = "@v5global.co.in";
    const CURRENT_VERSION = "1.0"; 

    let masterData = [];
    let currentStep = 1;

    window.onload = async () => {
        let email = localStorage.getItem("user_email");
        if (!email) {
            email = prompt("Enter your @v5global.co.in email:");
            if (email && email.toLowerCase().endsWith(DOMAIN)) {
                localStorage.setItem("user_email", email.toLowerCase().trim());
            } else {
                document.getElementById('status-text').innerHTML = "<h3 style='color:red;'>Access Denied!</h3>Official domain required.";
                return;
            }
        }
        loadData();
    };

    async function loadData() {
        try {
            // Naya data fetch karna
            const res = await fetch(SHEET_API_URL, { redirect: 'follow' });
            const rawData = await res.json();
            const userEmail = localStorage.getItem("user_email").toLowerCase().trim();

            console.log("Users in Sheet:", rawData.users); // Debugging

            // 1. KILL SWITCH (Strict Check)
            const userEntry = rawData.users.find(u => u.email === userEmail);
            
            // Agar user list mein nahi hai YA status 'Active' nahi hai
            if (!userEntry || userEntry.status.toLowerCase().trim() !== "active") {
                document.getElementById('status-text').innerHTML = 
                    "<div style='color:red;'><h2>🚫 ACCESS REVOKED</h2><p>Aapka account Inactive hai.<br>Manager se sampark karein.</p></div>";
                return;
            }

            // 2. VERSION SYNC
            if (parseFloat(rawData.latestVersion) > parseFloat(CURRENT_VERSION)) {
                document.getElementById('status-text').innerHTML = 
                    "<h2>⚠️ Update Required</h2><p>New version v"+rawData.latestVersion+" is live.</p><button onclick='location.reload()' style='padding:10px;'>Refresh Now</button>";
                return;
            }

            masterData = rawData.steps;
            document.getElementById('overlay').style.display = 'none';
            renderStep(1);
        } catch (e) {
            console.error(e);
            document.getElementById('status-text').innerHTML = "Database Error!<br>Check Sheet Tab Names.";
        }
    }

    function renderStep(sid) {
        const data = masterData.find(d => d.step == sid);
        if (!data) return finish();
        currentStep = sid;
        document.getElementById('instr-text').innerText = data.instruction;
        document.getElementById('step-id').innerText = "Step " + sid;
        const optCont = document.getElementById('opt-container');
        const navArea = document.getElementById('nav-area');
        optCont.innerHTML = "";
        
        if (data.options && data.options.trim() !== "") {
            navArea.style.display = "none";
            data.options.split(',').forEach(opt => {
                const parts = opt.split(':');
                if(parts.length === 2) {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn";
                    btn.innerText = parts[0].trim();
                    btn.onclick = () => renderStep(parts[1].trim());
                    optCont.appendChild(btn);
                }
            });
        } else {
            navArea.style.display = "block";
            document.getElementById('ack-check').checked = false;
            document.getElementById('next-btn').disabled = true;
        }
    }

    document.getElementById('ack-check').onchange = function() {
        document.getElementById('next-btn').disabled = !this.checked;
    };

    function goNext() { renderStep(parseInt(currentStep) + 1); }
    function finish() { document.getElementById('main-content').innerHTML = "<h3>✅ Action Complete!</h3>"; }
</script>
</body>
</html>
