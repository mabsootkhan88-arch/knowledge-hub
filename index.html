<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --warn: #f59e0b; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 15px; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        .header { font-weight: 700; font-size: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; color: var(--primary); display: flex; justify-content: space-between; }
        
        .instruction { font-size: 14px; line-height: 1.6; margin: 15px 0; min-height: 60px; overflow-y: auto; }
        .opt-grid { display: grid; gap: 10px; }
        .opt-btn { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer; text-align: left; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .opt-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }

        .next-btn { width: 100%; margin-top: 15px; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .next-btn:disabled { background: #cbd5e1; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px; box-sizing: border-box; }
        
        .announcement-box { width: 100%; max-width: 350px; background: #fffbeb; border: 2px solid var(--warn); border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .ann-header { color: #92400e; font-weight: 700; font-size: 16px; margin-bottom: 12px; text-transform: uppercase; }
        .ann-body { color: #92400e; font-size: 13px; line-height: 1.5; margin-bottom: 20px; white-space: pre-wrap; }
        
        .status-icon { font-size: 48px; margin-bottom: 20px; }
        .status-title { font-size: 20px; font-weight: 700; color: var(--danger); margin-bottom: 10px; }
        .status-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; }
        .reset-link { font-size: 12px; color: var(--primary); text-decoration: underline; cursor: pointer; background: none; border: none; margin-top: 20px; }
    </style>
</head>
<body>

<div id="overlay">
    <div id="status-content">
        <div class="status-icon">🔄</div>
        <div class="status-title" style="color: var(--primary);">Authenticating</div>
        <div class="status-desc">Verifying credentials...</div>
    </div>
</div>

<div class="header">
    <span>KNOWLEDGE HUB PRO</span>
    <span id="step-id" style="color: var(--text-sub); font-size: 11px;">v1.0</span>
</div>

<div id="main-content">
    <div class="instruction" id="instr-text">Loading...</div>
    <div id="opt-container" class="opt-grid"></div>
    <div id="nav-area" style="display:none; margin-top: 15px;">
        <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center;">
            <input type="checkbox" id="ack-check" style="margin-right: 8px;"> I have understood this step.
        </label>
        <button class="next-btn" id="next-btn" disabled onclick="goNext()">Continue</button>
    </div>
</div>

<script>
    // 1. APNA APPS SCRIPT URL YAHAN DALEIN
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwgWEZv2nKZEpPyMMOn2hqfr2pge3f_VFhMtZds9x0w8tHhGOWyHxFkOSHtm1tFu3VG/exec";
    const DOMAIN = "@v5global.co.in";
    const CURRENT_VERSION = "1.0"; 

    let masterData = [];
    let currentStep = 1;

    function logout() { localStorage.clear(); location.reload(); }

    window.onload = async () => {
        let email = localStorage.getItem("user_email");
        if (!email) {
            email = prompt("Enter your @v5global.co.in email:");
            if (email && email.toLowerCase().endsWith(DOMAIN)) {
                localStorage.setItem("user_email", email.toLowerCase().trim());
                location.reload();
            } else {
                showStatus("UNAUTHORIZED", "Please use company email.<br><button class='reset-link' onclick='logout()'>Try Again</button>");
                return;
            }
        }
        await loadData();
    };

    async function loadData() {
        try {
            const res = await fetch(SHEET_API_URL, { redirect: 'follow' });
            const rawData = await res.json();
            const userEmail = localStorage.getItem("user_email").toLowerCase().trim();

            // USER AUTHORIZATION CHECK
            const userEntry = rawData.users.find(u => u.email === userEmail);
            if (!userEntry || userEntry.status.toLowerCase().trim() !== "active") {
                showStatus("ACCESS REVOKED", `Account: <b>${userEmail}</b><br>Please reach out to your POC.<br><button class='reset-link' onclick='logout()'>Switch Account</button>`);
                return;
            }

            // URGENT ANNOUNCEMENT BOARD
            if (parseFloat(rawData.latestVersion) > parseFloat(CURRENT_VERSION)) {
                showAnnouncement(rawData.latestVersion, rawData.announcement);
                return;
            }

            // DAILY HEARTBEAT LOGGING
            const today = new Date().toDateString();
            if (localStorage.getItem("last_heartbeat") !== today) {
                fetch(SHEET_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ email: userEmail, action: "Active Login", version: CURRENT_VERSION })
                }).then(() => localStorage.setItem("last_heartbeat", today));
            }

            masterData = rawData.steps;
            document.getElementById('overlay').style.display = 'none';
            renderStep(1);
        } catch (e) {
            showStatus("ERROR", "Connection failed.<br><button class='reset-link' onclick='logout()'>Reset</button>", "❌");
        }
    }

    function showAnnouncement(ver, msg) {
        document.getElementById('status-content').innerHTML = `
            <div class="announcement-box">
                <div class="ann-header">⚠️ URGENT UPDATE (v${ver})</div>
                <div class="ann-body">${msg || "Guidelines have been updated. Please review before proceeding."}</div>
                <button onclick="location.reload()" style="width:100%; padding:12px; background:var(--warn); color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer;">I HAVE READ & UNDERSTOOD</button>
            </div>`;
    }

    function showStatus(title, desc, icon = "🚫") {
        document.getElementById('status-content').innerHTML = `<div class="status-icon">${icon}</div><div class="status-title">${title}</div><div class="status-desc">${desc}</div>`;
    }

    function renderStep(sid) {
        const data = masterData.find(d => d.step == sid);
        if (!data) return finish();
        currentStep = sid;
        document.getElementById('instr-text').innerText = data.instruction;
        document.getElementById('step-id').innerText = "STEP " + sid;
        const optCont = document.getElementById('opt-container');
        const navArea = document.getElementById('nav-area');
        optCont.innerHTML = "";
        if (data.options && data.options.trim() !== "") {
            navArea.style.display = "none";
            data.options.split(',').forEach(opt => {
                const parts = opt.split(':');
                if(parts.length === 2) {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn";
                    btn.innerText = parts[0].trim();
                    btn.onclick = () => renderStep(parts[1].trim());
                    optCont.appendChild(btn);
                }
            });
        } else {
            navArea.style.display = "block";
            document.getElementById('ack-check').checked = false;
            document.getElementById('next-btn').disabled = true;
        }
    }

    document.getElementById('ack-check').onchange = function() { document.getElementById('next-btn').disabled = !this.checked; };
    function goNext() { renderStep(parseInt(currentStep) + 1); }
    function finish() { document.getElementById('main-content').innerHTML = "<div style='text-align:center; padding:30px;'><div style='font-size:40px;'>✅</div><h3>Complete</h3><button onclick='location.reload()' style='padding:10px 20px; border-radius:6px; border:1px solid #ccc; cursor:pointer;'>Restart Flow</button></div>"; }
</script>
</body>
</html>
